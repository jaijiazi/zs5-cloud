<title>造神计划 · 云端版</title>
<style>
:root{
  /* ===== 设计系统 v5 · 暖石白 + 烧焦橙 + 教练靛蓝（finesse 定稿）===== */
  --paper:#f0ece5;              /* 暖石白页底（带暖调，非惨白） */
  --card:#fffdf8;               /* 卡片面（更亮一级，与页底分层） */
  --ink:#2b2620;                /* 主文字·暖近黑 */
  --ink-2:#5a5248;              /* 次级文字 */
  --faint:#8a8072;              /* 弱化文字 */
  --line:#e3dccf;               /* 分隔线·暖灰 */
  --hairline:#d6cdbc;           /* 细边框 */
  --soft:#f6f2ea;               /* 浅暖灰分区底 */
  /* 强调色 */
  --accent:#D9642A;             /* 烧焦橙·主色（能量/汗水/CTA/蛋白/选中态） */
  --accent-2:#A8402C;           /* 砖红·深一档（hover/压感） */
  --coach:#4A46C9;              /* 教练靛蓝·Agent 专属标识（「我做的」区块） */
  --ok:#2f7d5d;                 /* 语义绿·达成/守住（仅用于结果，非主视觉） */
  --warn:#B77A16;               /* 琥珀·提醒/回补日 */
  --bad:#A32D2D;                /* 警示红·超标/红线/退步 */
  --c-p:var(--accent);          /* 蛋白 = 主色（橙） */
  --c-c:#2f6db5;                /* 碳水 = 蓝 */
  --c-f:#8a5bb5;                /* 脂肪 = 紫 */
  /* 字体 */
  --serif:Georgia,"Noto Serif SC","Songti SC",serif;
  --sans:"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono","Consolas",monospace;
  /* 布局 */
  --sb-w:248px;--sb-w-c:64px;--tb-h:62px;
  --r-lg:14px;--r-md:10px;--r-sm:7px;  /* 圆角：卡片/控件/标签 */
  --shadow:0 1px 3px rgba(60,45,20,.06),0 4px 14px rgba(60,45,20,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.7}
::selection{background:var(--accent);color:#fff}
#app{display:flex;min-height:100vh}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb-w);background:var(--card);border-right:1px solid var(--hairline);z-index:40;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;transition:width .25s ease}
#sidebar.collapsed{width:var(--sb-w-c)}
#content{margin-left:var(--sb-w);transition:margin-left .25s ease;flex:1;min-width:0}
#sidebar.collapsed~#content{margin-left:var(--sb-w-c)}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--hairline);position:sticky;top:0;background:rgba(240,236,229,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:30}
.topbar h1{font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:.06em}
.topbar .tm{font-size:11px;color:var(--faint);font-family:var(--mono);letter-spacing:.1em;margin-left:auto}
.sb-logo{padding:24px 20px 18px;font-family:var(--serif);font-size:20px;font-weight:900;letter-spacing:.12em;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;color:var(--accent)}
#sidebar.collapsed .sb-logo{text-align:center;font-size:15px;padding:22px 0}
.sb-nav{flex:1;padding:8px 0}
.sb-item{display:flex;align-items:center;gap:10px;padding:13px 20px;width:100%;appearance:none;border:none;background:none;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--faint);border-left:3px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden;text-align:left}
.sb-item:hover{background:var(--soft);color:var(--ink)}
.sb-item.on{color:var(--accent);border-left-color:var(--accent);font-weight:600;background:rgba(217,100,42,.08)}
.sb-item svg{width:18px;height:18px;flex:none}
.sb-item .sb-no{font-family:var(--mono);font-size:10px;opacity:.5;flex:none}
#sidebar.collapsed .sb-item{padding:13px 0;justify-content:center;gap:0}
#sidebar.collapsed .sb-no,#sidebar.collapsed .sb-label{display:none}
.sb-toggle{padding:14px 20px;border-top:1px solid var(--line);appearance:none;border-left:none;border-right:none;border-bottom:none;background:var(--soft);cursor:pointer;font-family:var(--sans);font-size:12px;color:var(--faint);letter-spacing:.1em;white-space:nowrap;text-align:left}
#sidebar.collapsed .sb-toggle{text-align:center}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
section{display:none;animation:fade .25s ease}
section.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-family:var(--serif);font-size:24px;font-weight:900;letter-spacing:.06em}
.sec-head .cap{font-size:11px;color:var(--faint);letter-spacing:.16em;font-family:var(--mono);text-transform:uppercase}
.card{border:1px solid var(--hairline);background:var(--card);margin-bottom:20px;border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.card .card-head{padding:12px 22px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.14em;color:var(--faint);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(246,242,234,.5)}
.card .card-head b{color:var(--ink);font-size:13px;letter-spacing:.08em}
.note{font-size:12.5px;color:var(--faint);line-height:1.8;padding:10px 22px 16px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0}
.kv .cell{padding:16px 22px;border-right:1px solid var(--line)}
.kv .cell:last-child{border-right:none}
.kv .k{font-size:11px;color:var(--faint);letter-spacing:.12em;margin-bottom:5px}
.kv .v{font-family:var(--mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.kv .v small{font-size:11px;color:var(--faint);font-weight:400;margin-left:4px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 16px;padding:20px 22px}
.field{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--faint);letter-spacing:.06em}
.field select,.field input,.field textarea{font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--hairline);padding:9px 10px;width:100%;border-radius:var(--r-sm)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,100,42,.14)}
.field textarea{min-height:64px;resize:vertical;line-height:1.6}
.btn-row{display:flex;gap:10px;padding:0 22px 18px;flex-wrap:wrap}
button.solid{appearance:none;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;font-family:var(--sans);font-size:13px;letter-spacing:.12em;padding:11px 26px;transition:all .15s;border-radius:var(--r-md);font-weight:600}
button.solid:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
button.ghost{appearance:none;cursor:pointer;border:1px solid var(--hairline);background:var(--card);color:var(--ink-2);font-family:var(--sans);font-size:13px;letter-spacing:.12em;padding:11px 22px;transition:all .15s;border-radius:var(--r-md)}
button.ghost:hover{border-color:var(--accent);color:var(--accent)}
button.sm{padding:7px 14px;font-size:12px}
.macro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.macro-cell{padding:18px 22px;border-right:1px solid var(--line)}
.macro-cell:last-child{border-right:none}
.macro-cell .t{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.18em;margin-bottom:7px}
.macro-cell .v{font-family:var(--mono);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.macro-cell .s{font-size:12px;color:var(--faint);margin-top:6px}
.meal-row{display:flex;justify-content:space-between;gap:18px;padding:13px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.meal-row:last-child{border-bottom:none}
.meal-row .mn{font-weight:700;font-size:13.5px;letter-spacing:.06em;flex:none;min-width:56px}
.meal-row .mi{font-size:13px;color:var(--faint);text-align:left;flex:1;min-width:200px}
.toggle-row{display:flex;gap:0;border:1px solid var(--accent);border-radius:var(--r-md);overflow:hidden;width:fit-content;margin:0 22px 18px}
.toggle-row button{appearance:none;border:none;cursor:pointer;background:var(--card);color:var(--faint);font-family:var(--sans);font-size:12.5px;letter-spacing:.08em;padding:9px 20px}
.toggle-row button.on{background:var(--accent);color:#fff;font-weight:600}
.warn{margin:0 22px 18px;border:1px solid var(--warn);background:#fbf3e3;padding:12px 15px;font-size:12.5px;line-height:1.9;border-radius:var(--r-md);color:var(--ink-2)}
.warn b{letter-spacing:.1em;color:var(--warn)}
.rule-list{padding:14px 22px 18px}
.rule-list .ri{display:flex;gap:12px;padding:7px 0;font-size:13px;line-height:1.7;border-bottom:1px dashed var(--line)}
.rule-list .ri:last-child{border-bottom:none}
.rule-list .ri .no{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none;margin-top:3px}
.ex-row{display:flex;align-items:flex-start;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line)}
.ex-row:last-child{border-bottom:none}
.ex-row .cb{width:19px;height:19px;border:1.5px solid var(--accent);border-radius:5px;flex:none;margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;background:var(--card);cursor:pointer}
.ex-row.done .cb{background:var(--accent)}
.ex-row .ex-body{flex:1;min-width:0}
.ex-row .ex-name{font-size:14px;font-weight:600}
.ex-row .ex-detail{font-size:12px;color:var(--faint);margin-top:3px}
.train-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;margin-bottom:20px;background:var(--card)}
.train-cell{padding:14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:80px;cursor:pointer;transition:background .12s}
.train-cell:hover{background:var(--soft)}
.train-cell.rest{background:var(--soft)}
.train-cell.on{border:2px solid var(--accent);background:rgba(217,100,42,.06)}
.train-cell .tc-d{font-family:var(--mono);font-size:11px;color:var(--faint)}
.train-cell .tc-t{font-size:13px;font-weight:600;margin-top:6px}
.train-cell .tc-c{font-size:10px;color:var(--faint);margin-top:4px}
.ing-row{display:flex;align-items:center;gap:10px;padding:10px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ing-row:last-child{border-bottom:none}
.ing-row .ing-name{font-weight:600;min-width:80px}
.ing-row .ing-stats{font-family:var(--mono);font-size:12px;color:var(--faint)}
.ing-row .ing-del{appearance:none;border:1px solid var(--line);background:none;cursor:pointer;font-size:11px;padding:3px 10px;color:var(--faint)}
.ing-row .ing-del:hover{border-color:var(--ink);color:var(--ink)}
.chart-box{padding:18px 22px 10px;overflow-x:auto}
.weight-form{display:flex;gap:10px;padding:16px 22px 0;flex-wrap:wrap;align-items:flex-end}
.weight-form .field{flex:1;min-width:130px}
.wt-table{width:100%;border-collapse:collapse;font-size:13px}
.wt-table th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--faint);padding:9px 22px;border-bottom:1px solid var(--ink);font-weight:400}
.wt-table td{padding:10px 22px;border-bottom:1px solid var(--line);font-family:var(--mono);font-variant-numeric:tabular-nums}
.wt-table .del{cursor:pointer;color:var(--faint);border:1px solid var(--line);background:none;appearance:none;font-size:11px;padding:2px 10px;letter-spacing:.1em}
.wt-table .del:hover{border-color:var(--ink);color:var(--ink)}
.empty-tip{padding:28px 22px;text-align:center;font-size:13px;color:var(--faint)}
.chat-box{max-height:400px;overflow-y:auto;padding:16px 22px;border-bottom:1px solid var(--line)}
.chat-msg{padding:8px 0;font-size:13px;line-height:1.7}
.chat-msg.sys b{font-weight:600;color:var(--ink)}
.chat-msg.usr{color:var(--faint);padding-left:20px}
.chat-input{display:flex;gap:10px;padding:14px 22px;flex-wrap:wrap;align-items:flex-end}
.rv-card{border:1px solid var(--hairline);margin-bottom:14px}
.rv-card .rc-head{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--soft);display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
.rv-card .rc-head b{color:var(--ink);font-size:13px}
.rv-card .rc-body{padding:12px 16px;font-size:13px;line-height:1.7}
.rv-img{max-width:120px;max-height:120px;margin:4px;border:1px solid var(--line)}
.basis-row{display:grid;grid-template-columns:minmax(120px,180px) 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.65}
.basis-row:last-child{border-bottom:none}
.basis-row .bk{color:var(--faint);font-size:11px;letter-spacing:.06em;padding-top:2px}
.basis-row .bv b{font-variant-numeric:tabular-nums}
.strat{border:1px solid var(--accent);border-radius:var(--r-md);padding:14px 16px;margin:0 0 14px;background:rgba(217,100,42,.04)}
.strat .st-t{font-size:11px;letter-spacing:.1em;color:var(--accent);margin-bottom:6px}
.strat .st-n{font-size:17px;font-weight:600;font-family:var(--serif),Georgia,serif}
.sync-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.sync-col{padding:16px 22px;border-right:1px solid var(--line)}
.sync-col:last-child{border-right:none}
.sync-col h4{font-size:11px;letter-spacing:.16em;color:var(--faint);margin-bottom:10px;font-family:var(--mono);font-weight:400}
.sync-col textarea{width:100%;min-height:88px;font-family:var(--mono);font-size:11px;line-height:1.5;border:1px solid var(--hairline);padding:8px;resize:vertical;background:var(--soft);color:var(--ink);border-radius:0}
.sync-col .btn-row{padding:10px 0 0;gap:8px}
.sync-col .btn-row button{padding:9px 14px;font-size:12px}
.sync-file{display:none}
.sync-hint{font-size:12px;color:var(--faint);line-height:1.8;margin-top:10px}
.linklike{appearance:none;background:none;border:none;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:12px;padding:0;font-family:var(--sans)}
.sync-status{padding:10px 22px;font-size:12.5px;line-height:1.7;border-top:1px solid var(--line);display:none}
.sync-status.ok{display:block;color:var(--faint)}
.sync-status.err{display:block;color:#a00}
.progress-track{height:4px;background:var(--soft);border:1px solid var(--line);border-radius:3px}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .3s;border-radius:3px}
.day-block{border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;margin-bottom:16px;background:var(--card);box-shadow:var(--shadow)}
.day-block .db-head{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--soft);display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.day-block .db-head b{font-family:var(--serif);font-size:17px;letter-spacing:.04em}
.day-block .db-head span{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em}
.day-block ul{list-style:none;padding:6px 0}
.day-block li{padding:7px 20px;font-size:13.5px;display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed var(--line)}
.day-block li:last-child{border-bottom:none}
.day-block li .nm{font-weight:500}
.day-block li .dt{font-family:var(--mono);font-size:12px;color:var(--faint);white-space:nowrap}
/* ===== V2: macro hero ===== */
.macro-hero{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 22px 0;background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.mh-cell{padding:18px 16px 14px;border-right:1px solid var(--line);min-width:0}
.mh-cell:last-child{border-right:none}
.mh-cell .mh-t{font-size:10.5px;letter-spacing:.2em;color:var(--faint);font-family:var(--mono);margin-bottom:8px}
.mh-cell .mh-v{font-family:var(--mono);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mh-cell .mh-v small{font-size:12px;font-weight:400;color:var(--faint);margin-left:3px}
.mh-cell .mh-s{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.6}
.mh-cell .mh-bar{height:5px;margin-top:10px;background:var(--ink);border-radius:3px;opacity:.9}
.mh-p .mh-v{color:var(--c-p)}.mh-p .mh-bar{background:var(--c-p)}
.mh-c .mh-v{color:var(--c-c)}.mh-c .mh-bar{background:var(--c-c)}
.mh-f .mh-v{color:var(--c-f)}.mh-f .mh-bar{background:var(--c-f)}
.mh-cal .mh-v{color:var(--ink)}.mh-cal .mh-bar{background:var(--ink)}
.mh-p .mh-v{color:var(--c-p)}.mh-p .mh-bar{background:var(--c-p)}
.mh-c .mh-v{color:var(--c-c)}.mh-c .mh-bar{background:var(--c-c)}
.mh-f .mh-v{color:var(--c-f)}.mh-f .mh-bar{background:var(--c-f)}
/* ===== V2: sticky macro bar ===== */
.sticky-macros{position:sticky;top:var(--tb-h);z-index:20;background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-lg);margin-bottom:18px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:var(--shadow);overflow:hidden}
.sm-cell{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.sm-cell:last-child{border-right:none}
.sm-cell .sm-k{font-size:10px;letter-spacing:.16em;color:var(--faint);font-family:var(--mono);margin-bottom:4px}
.sm-cell .sm-v{font-family:var(--mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.sm-cell .sm-v small{font-size:11px;font-weight:400;color:var(--faint)}
.sm-cell .sm-s{font-size:10.5px;color:var(--faint);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-cell .sm-s b{font-weight:600}
/* ===== V2: QA box ===== */
.qa-box{border-top:1px solid var(--hairline);margin:0 22px 20px;padding:14px 0 16px}
.qa-hist{max-height:230px;overflow-y:auto;margin-bottom:10px;border:1px solid var(--line);background:var(--soft);padding:8px 12px;border-radius:var(--r-md)}
.qa-msg{padding:5px 0;font-size:13px;line-height:1.7}
.qa-msg.q{color:var(--faint)}
.qa-msg.a b{color:var(--c-p)}
.qa-form{display:flex;gap:8px;flex-wrap:wrap}
.qa-form input{flex:1;min-width:180px;font-family:var(--sans);font-size:13px;padding:9px 10px;border:1px solid var(--hairline);background:var(--card);color:var(--ink);border-radius:var(--r-sm)}
.qa-form input:focus{outline:none;border-color:var(--accent)}
.qa-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.qa-chips button{appearance:none;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-size:11.5px;padding:5px 10px;color:var(--faint)}
.qa-chips button:hover{border-color:var(--ink);color:var(--ink)}
/* ===== V2: food db dropdown ===== */
.food-drop{position:absolute;left:0;right:0;top:100%;background:var(--paper);border:1px solid var(--ink);z-index:15;max-height:240px;overflow-y:auto;box-shadow:0 6px 18px rgba(0,0,0,.1)}
.fd-item{padding:8px 12px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line);line-height:1.5}
.fd-item:hover{background:var(--soft)}
.fd-item .fd-n{font-weight:600}
.fd-item .fd-s{font-family:var(--mono);font-size:10.5px;color:var(--faint)}

/* ============ STORE（云端适配器 · 脱离纯本地存储） ============ *
 * 数据以 key→JSON 字符串存于内存 DB，mt 记录每 key 的最后修改时间（mtime）。
 * 每次写操作：更新内存+本地镜像(localStorage 兜底)→标记脏→防抖上报云端；
 * 云端按 key 级 mtime 合并（较新方胜），实现多设备实时同步。
 * 弱网：上报失败保留脏标记并退避重试；云端不可达时仅用本地镜像，恢复后自动批量同步。
 */
var mt={};
try{mt=JSON.parse(localStorage.getItem(KEYS.MTIME)||'{}')||{};}catch(e){mt={};}
var DB={};
var CLOUD={token:null,online:true,ready:false};
function zsGet(key,def){try{var v=DB[key];if(v==null)return def;return JSON.parse(v);}catch(e){return def;}}
function zsSet(key,val){try{DB[key]=JSON.stringify(val);mt[key]=Date.now();_saveMirror();_mark(key);}catch(e){}}
function zsTouch(key){mt[key]=Date.now();_saveMirror();_mark(key);}
/* ---- 本地镜像（弱网/离线兜底，非主存储） ---- */
function _localGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function _localSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function _mirrorKeys(){return SYNC_KEYS.concat([KEYS.MTIME,KEYS.MIGRATED,KEYS.SYNCLAST]);}
function _saveMirror(){try{_mirrorKeys().forEach(function(k){if(k in DB)_localSet(k,DB[k]);});_localSet(KEYS.MTIME,JSON.stringify(mt));}catch(e){}}
function _loadMirror(){try{SYNC_KEYS.concat([KEYS.MIGRATED,KEYS.SYNCLAST]).forEach(function(k){var v=_localGet(k);if(v!=null)DB[k]=v;});var m=JSON.parse(_localGet(KEYS.MTIME)||'{}');if(m&&typeof m==='object')mt=m;}catch(e){}}
/* ---- 令牌与云端连接 ---- */
function _tokenFromURL(){try{var u=new URL(location.href);var w=u.searchParams.get('ws');if(w)return w;var h=u.hash.match(/ws=([^&]+)/);return h?h[1]:null;}catch(e){return null;}}
function _setURLToken(t){try{var u=new URL(location.href);u.searchParams.set('ws',t);history.replaceState(null,'',u.pathname+u.search+u.hash);}catch(e){}}
function _createWS(){return fetch('/api/workspace/new').then(function(r){return r.json();}).then(function(res){return res.token;});}
/* ---- 上报 / 拉取 ---- */
var _dirty={},_pushT=null,_retryT=null,_sending=false;
function _mark(k){_dirty[k]=true;if(_pushT||_sending)return;_pushT=setTimeout(_flush,500);}
function _flush(){_pushT=null;var keys=Object.keys(_dirty);if(!keys.length)return;_dirty={};if(!CLOUD.token||!CLOUD.online){scheduleRetry();return;}_send(keys);}
function _send(keys){
  if(_sending){keys.forEach(function(k){_dirty[k]=true;});scheduleRetry();return;}
  _sending=true;
  var data={},m={};keys.forEach(function(k){data[k]=DB[k];m[k]=mt[k];});
  fetch('/api/workspace/'+encodeURIComponent(CLOUD.token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:data,mt:m})})
    .then(function(r){return r.json();})
    .then(function(res){_sending=false;CLOUD.online=true;_reconcile(res.data,res.mt);_setCloudStatus('ok');})
    .catch(function(){_sending=false;keys.forEach(function(k){_dirty[k]=true;});scheduleRetry();_setCloudStatus('err');});
}
function scheduleRetry(){if(_retryT)return;_retryT=setTimeout(function(){_retryT=null;if(CLOUD.online)_flush();},5000);}
function _reconcile(sdata,smt){if(!sdata)return;var changed=false;Object.keys(smt||{}).forEach(function(k){var sm=smt[k]||0,lm=mt[k]||0;if(sm>lm){mt[k]=sm;DB[k]=sdata[k];changed=true;}});if(changed){try{refreshAll();}catch(e){}}}
function _pull(){if(!CLOUD.token||!CLOUD.online)return;fetch('/api/workspace/'+encodeURIComponent(CLOUD.token)).then(function(r){return r.json();}).then(function(res){CLOUD.online=true;_reconcile(res.data,res.mt);_setCloudStatus('ok');}).catch(function(){CLOUD.online=false;_setCloudStatus('local');});}
function _setCloudStatus(s){var el=document.getElementById('cloud-status');if(!el){el=document.createElement('div');el.id='cloud-status';el.style.cssText='position:fixed;right:12px;top:10px;z-index:60;font-size:11px;padding:4px 10px;border-radius:20px;background:rgba(0,0,0,.05);color:#3a7;letter-spacing:.02em';document.body.appendChild(el);}var map={ok:'☁ 已同步云端',err:'⚠ 同步失败·重试中',local:'⚡ 离线·本地保存'};el.textContent=map[s]||'';el.style.color=(s==='err')?'#a00':(s==='local')?'#a5631a':'#3a7';}
/* ---- 启动：取令牌→拉取云端（失败则本地镜像）→渲染 ---- */
function cloudInit(done){
  CLOUD.token=_tokenFromURL()||_localGet('zs5_ws')||null;
  var boot=function(){_loadAndRender(done);};
  if(!CLOUD.token){_createWS().then(function(t){CLOUD.token=t;_localSet('zs5_ws',t);_setURLToken(t);boot();}).catch(function(){boot();});}
  else{_localSet('zs5_ws',CLOUD.token);boot();}
}
function _clearMirror(){
  try{_mirrorKeys().concat([KEYS.MTIME]).forEach(function(k){localStorage.removeItem(k);});}catch(e){}
}
function _loadAndRender(done){
  if(!CLOUD.token){_loadMirror();CLOUD.online=false;_setCloudStatus('local');done();return;}
  _clearMirror();DB={};mt={};
  fetch('/api/workspace/'+encodeURIComponent(CLOUD.token)).then(function(r){return r.json();}).then(function(res){
    Object.keys(res.data||{}).forEach(function(k){DB[k]=res.data[k];});
    Object.keys(res.mt||{}).forEach(function(k){mt[k]=res.mt[k]||0;});
    _saveMirror();CLOUD.online=true;_setCloudStatus('ok');done();
  }).catch(function(){CLOUD.online=false;_loadMirror();_setCloudStatus('local');done();});
}
/* 网络事件：恢复即拉取+补发；切后台回前台拉取；定时保活 */
try{
  window.addEventListener('online',function(){CLOUD.online=true;_pull();_flush();});
  window.addEventListener('offline',function(){CLOUD.online=false;_setCloudStatus('local');});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)_pull();});
  window.addEventListener('focus',function(){_pull();});
  setInterval(_pull,30000);
}catch(e){}
/* ---- 图片上传（云端对象存储，失败回退 base64 本地） ---- */
function uploadImage(file){
  return new Promise(function(resolve){
    if(!CLOUD.token||!navigator.onLine){var fr0=new FileReader();fr0.onload=function(){resolve(fr0.result);};fr0.readAsDataURL(file);return;}
    var fd=new FormData();fd.append('file',file,file.name);
    var xhr=new XMLHttpRequest();xhr.open('POST','/api/upload/'+encodeURIComponent(CLOUD.token));
    xhr.onload=function(){try{var r=JSON.parse(xhr.responseText);if(r&&r.url)resolve(r.url);else throw 0;}catch(e){var fr=new FileReader();fr.onload=function(){resolve(fr.result);};fr.readAsDataURL(file);}};
    xhr.onerror=function(){var fr=new FileReader();fr.onload=function(){resolve(fr.result);};fr.readAsDataURL(file);};
    xhr.send(fd);
  });
}

/* ============ CALC ============ */
function calcBMR(p){var w=parseFloat(p.weight)||70,h=parseFloat(p.height)||170,a=parseInt(p.age)||25,m=p.sex==='m';return Math.round(10*w+6.25*h-5*a+(m?5:-161));}
function calcTDEE(bmr,act,isT){var a=parseFloat(act)||1.375;return Math.round(bmr*(isT?(a+0.10):Math.max(a-0.05,1.05)));}
function calcGap(profile){
  var w=parseFloat(profile.weight)||70,h=parseFloat(profile.height)||170,m=profile.sex==='m',age=parseInt(profile.age)||25;
  var bfRaw=parseFloat(profile.bf),bmi=w/((h/100)*(h/100)),act=parseFloat(profile.activity)||1.375,freq=parseInt(profile.weeklyDays)||0,prog=profile.progress||'new';
  var bmr=calcBMR(profile),tdeeT=calcTDEE(bmr,act,true),tdeeR=calcTDEE(bmr,act,false),avgTDEE=(tdeeT+tdeeR)/2;
  var reasons=[],bfKnown=isFinite(bfRaw)&&bfRaw>=3,fatLevel;
  if(bfKnown){fatLevel=(bfRaw>=(m?28:35))?'high':(bfRaw>=(m?20:28))?'mid':'low';
    reasons.push('体脂率 '+bfRaw+'%（'+(fatLevel==='high'?'偏高':fatLevel==='mid'?'中等':'偏低')+'）'+(fatLevel==='high'?'：可承受较大热量缺口':fatLevel==='mid'?'：中等缺口兼顾保肌':'：缺口需收窄'));}
  else{fatLevel=bmi>=(m?30:28)?'high':(bmi>=24?'mid':'low');
    reasons.push('未填体脂率，按 BMI '+bmi.toFixed(1)+' 评估'+(fatLevel==='high'?'（肥胖区间）：可承受较大缺口':fatLevel==='mid'?'（超重区间）：中等缺口':'（正常区间）：缺口收窄'));}
  var basePct=fatLevel==='high'?0.24:fatLevel==='mid'?0.20:0.15;
  if(freq>=5)reasons.push('每周训练 '+freq+' 次：训练量大，缺口上限 TDEE 25%');
  else if(freq>=3)reasons.push('每周训练 '+freq+' 次：中等训练量');
  else reasons.push('每周训练 '+freq+' 次：缺口主要靠饮食');
  var pct=basePct;
  if(prog==='plateau'){pct+=0.02;reasons.push('平台期：缺口上调 2%');}
  if(prog==='long'){pct-=0.03;reasons.push('长期减脂：代谢适应，缺口下调 3%');}
  pct=Math.max(Math.min(pct,0.25),0.13);
  var cut=Math.round(Math.min(Math.max(pct*avgTDEE,300),1100));
  return{bmr:bmr,tdeeT:tdeeT,tdeeR:tdeeR,avgTDEE:Math.round(avgTDEE),cut:cut,pct:pct,fatLevel:fatLevel,reasons:reasons,bmi:bmi,bfKnown:bfKnown,bfRaw:bfRaw};
}
function calcMacros(profile,gap,isT){
  var w=parseFloat(profile.weight)||70,freq=parseInt(profile.weeklyDays)||0,m=profile.sex==='m';
  var pk=gap.pct>=0.24?2.0:1.8,p=Math.min(Math.round(pk*w),230),f=Math.max(Math.round(0.55*w),40);
  var tdee=isT?gap.tdeeT:gap.tdeeR,cut=isT?gap.cut:Math.round(gap.cut*0.9),cal=tdee-cut;
  var floor=m?(isT?1500:1400):(isT?1250:1200),warns=[];
  if(cal<floor){cal=floor;warns.push((isT?'训练日':'休息日')+'热量已到安全下限');}
  var c=Math.round((cal-4*p-9*f)/4);
  if(isT&&c<60){c=60;warns.push('训练日碳水已到下限');}
  if(!isT&&c<50)c=50;
  return{cal:cal,p:p,c:c,f:f,warns:warns,pk:pk};
}

/* ============ DIET GEN（仅从用户食材库匹配 + 每周轮换 + 结构化可编辑食谱） ============ */
function findIng(ings,pred){for(var i=0;i<ings.length;i++)if(pred(ings[i]))return ings[i];return null;}
function genMeals(macros,ingredients){
  var p=macros.p,c=macros.c,f=macros.f;
  var ings=(ingredients&&ingredients.length)?ingredients:DEF_ING;
  function byId(id){for(var i=0;i<ings.length;i++)if(ings[i].id===id)return ings[i];return null;}
  function byName(kw){for(var i=0;i<ings.length;i++)if(ings[i].name.indexOf(kw)>=0)return ings[i];return null;}
  var egg=byId('egg')||byName('鸡蛋');
  var milk=byId('milk')||byName('牛奶');
  var oats=byId('oats')||byName('燕麦');
  var prots=ings.filter(function(x){return x.cat==='蛋白'&&x.p>=15&&x!==egg;});
  var carbs=ings.filter(function(x){return x.cat==='碳水'&&x.c>=15&&x!==milk&&x!==oats;});
  if(!prots.length)prots=[{name:'鸡胸肉',p:23,c:0,f:1,kcal:104}];
  if(!carbs.length)carbs=[{name:'熟米饭',p:3,c:26,f:1,kcal:130}];
  var wkIdx=Math.floor(Date.now()/604800000);/* 每周轮换种子 */
  var mainP=prots[wkIdx%prots.length],mainC=carbs[wkIdx%carbs.length],dinP=prots[(wkIdx+1)%prots.length];
  var veg=findIng(ings,function(x){return x.cat==='蔬菜';});
  var oil=byId('oil')||byName('油');
  var whey=byId('whey')||byName('蛋白粉');
  function mk(src,gram,note,fixed){return {name:src.name,gram:Math.round(gram),p:src.p||0,c:src.c||0,f:src.f||0,kcal:src.kcal||0,note:note||'',fixed:!!fixed};}
  /* 早餐：蛋+奶+燕麦（蛋/奶为固定份量，蛋白缺口由补剂补足；食材库缺少则回退蛋白+碳水主食） */
  var bf=[];
  if(egg&&milk&&oats){
    var oatsG=r5(Math.min(Math.max((c*0.28-(milk.c||5)*2.5)/((oats.c||60)/100),30),100));
    bf.push(mk(egg,100,'约2个·固定份量',true));
    bf.push(mk(milk,250,'固定份量',true));
    bf.push(mk(oats,oatsG,''));
  }else{
    bf.push(mk(mainP,Math.min(Math.max(p*0.25/((mainP.p||20)/100),40),250)));
    bf.push(mk(mainC,Math.max(c*0.28/((mainC.c||25)/100),40)));
  }
  /* 午餐：蛋白+碳水+蔬菜+油 */
  var lu=[mk(mainP,Math.min(Math.max(p*0.40/((mainP.p||20)/100),40),300)),mk(mainC,Math.max(c*0.40/((mainC.c||25)/100),50))];
  if(veg)lu.push(mk(veg,150,'不限量'));
  if(oil)lu.push(mk(oil,Math.min(Math.max(f/3,5),15),'烹调用'));
  /* 晚餐：轮换蛋白+碳水+蔬菜 */
  var dn=[mk(dinP,Math.min(Math.max(p*0.30/((dinP.p||20)/100),40),300),'本周轮换'),mk(mainC,Math.max(c*0.28/((mainC.c||25)/100),40))];
  if(veg)dn.push(mk(veg,150,'不限量'));
  var mealPlan=[{k:'早餐',key:'breakfast',items:bf},{k:'午餐',key:'lunch',items:lu},{k:'晚餐',key:'dinner',items:dn}];
  recalcPlan(mealPlan,{p:p,c:c,f:f});
  /* 补剂：按剩余蛋白量补足 */
  var su=[],tot0=planTotals(mealPlan),remP=p-tot0.p;
  if(whey&&remP>3)su.push(mk(whey,r5(remP/((whey.p||80)/100)),''));
  if(su.length)mealPlan.push({k:'补剂',key:'supplement',items:su});
  return planToText(mealPlan,{p:p,c:c,f:f});
}
/* 食材分类：p蛋白类 c碳水类 f脂肪类 x固定（蔬果/奶等） */
function itemClass(it){
  if((it.f||0)>=40)return 'f';
  if((it.p||0)>=8&&(it.p||0)>(it.c||0))return 'p';
  if((it.c||0)>=12)return 'c';
  return 'x';
}
function planTotals(mealPlan){
  var t={p:0,c:0,f:0,kcal:0};
  mealPlan.forEach(function(m){m.items.forEach(function(it){t.p+=(it.p||0)*(it.gram||0)/100;t.c+=(it.c||0)*(it.gram||0)/100;t.f+=(it.f||0)*(it.gram||0)/100;t.kcal+=(it.kcal||0)*(it.gram||0)/100;});});
  t.p=Math.round(t.p);t.c=Math.round(t.c);t.f=Math.round(t.f);t.kcal=Math.round(t.kcal);
  return t;
}
/* 按当日三大营养素总目标重算各食材推荐克重：同类食材保持相对比例、整体缩放到餐级目标。
   目标先扣除"旁路营养素"——固定类（蔬果/奶/脂肪/固定份量）自带的蛋白与碳水、碳水类自带的蛋白——避免重复计入导致总量超标 */
function recalcPlan(mealPlan,targets){
  var shares={breakfast:[.25,.28],lunch:[.40,.40],dinner:[.30,.28],supplement:[.05,.04]};
  mealPlan.forEach(function(m){
    var sh=shares[m.key]||[.25,.25];
    var tp=targets.p*sh[0],tc=targets.c*sh[1];
    var fixP=0,fixC=0;
    m.items.forEach(function(it){var cl=itemClass(it);if(it.fixed||cl==='x'||cl==='f'){fixP+=(it.p||0)*(it.gram||0)/100;fixC+=(it.c||0)*(it.gram||0)/100;}});
    /* ① 碳水类先缩放：餐级碳水目标扣除固定类自带碳水 */
    var curC=0;
    m.items.forEach(function(it){if(!it.fixed&&itemClass(it)==='c')curC+=(it.c||0)*(it.gram||0)/100;});
    var tcNet=tc-fixC;
    if(curC>0&&tcNet>0)m.items.forEach(function(it){if(!it.fixed&&itemClass(it)==='c')it.gram=Math.max(10,Math.min(600,r5(it.gram*tcNet/curC)));});
    /* ② 蛋白类后缩放：餐级蛋白目标扣除固定类+碳水类（缩放后）带来的蛋白 */
    var sideP=fixP;
    m.items.forEach(function(it){if(!it.fixed&&itemClass(it)==='c')sideP+=(it.p||0)*(it.gram||0)/100;});
    var curP=0;
    m.items.forEach(function(it){if(!it.fixed&&itemClass(it)==='p')curP+=(it.p||0)*(it.gram||0)/100;});
    var tpNet=tp-sideP;
    if(curP>0&&tpNet>0)m.items.forEach(function(it){if(!it.fixed&&itemClass(it)==='p')it.gram=Math.max(10,Math.min(600,r5(it.gram*tpNet/curP)));});
    /* 脂肪类与固定份量（蛋/奶/蔬果）保持原克重 */
  });
  return mealPlan;
}
function planToText(mealPlan){
  function txt(m){return m.items.map(function(it){return it.name+' '+it.gram+'g'+(it.note?'（'+it.note+'）':'');}).join(' + ');}
  var out={};
  mealPlan.forEach(function(m){out[m.key]=txt(m);});
  out.plan=mealPlan;
  out.totals=planTotals(mealPlan);
  return out;
}

/* ============ TRAINING GEN ============ */
function genTrainingPlan(profile){
  var days=parseInt(profile.weeklyDays)||3;
  var split=SPLITS[days]||SPLITS[3],indices=DAY_MAP[days]||DAY_MAP[3],plan=[],si=0;
  for(var i=1;i<=7;i++){
    if(indices.indexOf(i)>=0&&si<split.length){
      var dp=split[si],exs=dp[0].ex.map(function(id){
        var ex=EX_LIB.find(function(e){return e.id===id;});
        return ex?{id:ex.id,name:ex.name,part:ex.part,sets:ex.sets,reps:ex.reps,weight:'',rest:ex.rest,rpe:ex.rpe}:null;
      }).filter(function(e){return e!==null;});
      plan.push({day:i,isTraining:true,bodyPart:dp[0].part,title:dp[0].part,exercises:exs});
      si++;
    }else{plan.push({day:i,isTraining:false,bodyPart:'休息',title:'休息',exercises:[]});}
  }
  return plan;
}
function rebalancePlan(plan){
  var issues=[];
  for(var i=0;i<plan.length;i++){
    if(!plan[i].isTraining)continue;
    var prev=i>0?plan[i-1]:null,next=i<6?plan[i+1]:null;
    if(prev&&prev.isTraining&&prev.bodyPart===plan[i].bodyPart)issues.push(DAY_LABELS[plan[i].day-1]+' 与 '+DAY_LABELS[prev.day-1]+' 连续练同一部位（'+plan[i].bodyPart+'）');
    if(plan[i].exercises.length>6)issues.push(DAY_LABELS[plan[i].day-1]+' 动作数偏多（'+plan[i].exercises.length+'个），建议控制在 3~6 个');
    if(plan[i].exercises.length<2)issues.push(DAY_LABELS[plan[i].day-1]+' 动作数偏少（'+plan[i].exercises.length+'个），建议至少 2 个');
  }
  var tDays=plan.filter(function(d){return d.isTraining;}).length;
  if(tDays>6)issues.push('每周训练 '+tDays+' 天，恢复日不足，建议至少 1 天完全休息');
  return issues;
}

/* ---- 体测进度条：三项达标状态（达标/进行中/待测） ---- */

function genDailyFeedback(text,images,pos,day){

    if(ex.name.length>=3){
      for(var i=0;i<ex.name.length-1;i++){
        if(t.indexOf(ex.name.substr(i,2))>=0){done.push(ex);return;}
      }
    }
  });
  var wts=[],m,re=/([\u4e00-\u9fa5A-Za-z0-9]+)\s*(\d+(?:\.\d+)?)\s*(?:kg|公斤)(?:\s*[×x*]\s*(\d+)(?:\s*[×x*]\s*(\d+))?)?/g;
  while((m=re.exec(t)))wts.push(m[0]);
  var rpeM=t.match(/rpe\s*(\d)/i);
  var rpe=rpeM?parseInt(rpeM[1]):null;
  var completion=planned.length?Math.round(done.length/planned.length*100):null;
  var inj=profile.injuries||'';
  /* 总结生成 */
  var h='<b>训练完成度：</b>'+(completion==null?('今日为休息日/无计划动作'+(t?'，按自述活动记录：'+esc(t.slice(0,60)):'')):(done.length+'/'+planned.length+'（'+completion+'%）'))+'<br>';
  var advice=[];
  if(completion!=null){
    if(completion>=100)advice.push('全部计划动作完成：下次训练可在原重量上尝试 +2.5~5kg 或每个动作加 1 次，保持 RPE≤8。');
    else if(completion>=60)advice.push('未完成的动作下次优先补上，已完成的动作重量维持不变。');

  }
  if(rpe!=null&&rpe>=9)advice.push('RPE '+rpe+' 偏高：本周剩余训练日把强度收回 RPE 7~8。');
  if(/疼|痛|不适/.test(t))advice.push('⚠️ 提到疼痛/不适'+(inj?'（你的伤病约束：'+esc(inj)+'）':'')+ '：相关动作先降重量或暂停，持续不适请就医检查。');
  if(wts.length)h+='<b>记录到的负重：</b>'+wts.map(esc).join('、')+'<br>';
  if(!wts.length&&planned.length&&completion>0)advice.push('这次没记录重量：下次把「动作+重量×组×次」一起写（如 器械推胸 40kg×3×12），周度复盘会更准。');
  h+='<b>动作执行建议：</b>'+(advice.length?advice.join('<br>'):'按计划执行即可，注意动作质量优先于重量。')+'<br>';
  h+='<b>数据同步：</b>已计入当日训练打卡、累计训练天数与周度复盘统计 ✓';
  /* 明日训练提示 */
  var nextPos=(pos%7)+1;
  var nextDay=train.find(function(d){return d.day===nextPos;});

  var review={date:todayStr(),type:'daily',day:'循环第'+pos+'天',dayIdx:pos,completion:completion,rpe:rpe,feeling:t,

function generatePlans(){
  var profile=zsGet(KEYS.PROFILE,DEF_PROFILE);
  var goal=zsGet(KEYS.GOAL,DEF_GOAL);
  var gap=calcGap(profile);
  var mT=calcMacros(profile,gap,true),mR=calcMacros(profile,gap,false);
  var freq=parseInt(profile.weeklyDays)||0;
  var stratName,stratWhy;
  if(freq>=4){stratName='双档碳水分配（温和碳水循环）';stratWhy='训练日碳水高于休息日：把大部分碳水安排在训练日，为 '+freq+' 次/周的训练提供糖原支持；休息日压低碳水扩大脂肪供能窗口。';}
  else{stratName='均衡碳水削减';stratWhy='训练频率较低，采用均衡缺口+均衡碳水即可。';}
  if(gap.pct>=0.22&&gap.fatLevel==='high')stratWhy+=' 体脂基数较高，此缺口可在监测下执行 4~6 周。';
  else if(gap.pct>=0.22)stratWhy+=' 属于短期冲刺用量，执行 2~4 周后复评。';
  var warnings=(mT.warns||[]).concat(mR.warns||[]);
  if(gap.pct>=0.22&&gap.fatLevel==='high')warnings.push('体脂偏高，此缺口可执行 4~6 周；体重降到 95kg 以下或体脂明显下降后复评');
  if(gap.pct>=0.22&&gap.fatLevel!=='high')warnings.push('当前缺口偏大，建议连续执行不超过 2~4 周');
  /* 截止日期倒推与节奏校验 */
  var dl=goal.deadline||'',weeksTotal=0,paceTarget=0;
  var paceCut=Math.round(gap.cut*7/7700*10)/10;
  if(dl){
    var dDays=Math.round((new Date(dl+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
    weeksTotal=Math.max(1,Math.round(dDays/7));
    var wLoss=Math.max(profile.weight-(goal.targetWeight||profile.weight),0);
    paceTarget=Math.round(wLoss/weeksTotal*10)/10;
    if(dDays<0)warnings.push('截止日期 '+dl+' 已过期，请到「制定计划」页重新选择截止日期');
    else if(paceTarget>1.5)warnings.push('按截止日期 '+dl+' 需平均每周减 '+paceTarget+'kg，超过安全速度（1~1.5kg/周），建议延后截止日期或调整目标体重');
    if(paceTarget>paceCut+0.15)warnings.push('当前缺口对应约 '+paceCut+'kg/周，慢于截止日期要求的 '+paceTarget+'kg/周，建议增加步数/快走或适度扩大缺口');
    else if(paceTarget>0&&paceTarget<paceCut-0.15)warnings.push('当前缺口对应约 '+paceCut+'kg/周，快于截止日期要求的 '+paceTarget+'kg/周，执行有余量，可适度放松饮食');
  }
  var ings=zsGet(KEYS.ING,DEF_ING);
  var wkIdx=Math.floor(Date.now()/604800000);
  var diet={bmr:gap.bmr,tdeeT:gap.tdeeT,tdeeR:gap.tdeeR,cut:gap.cut,pct:gap.pct,fatLevel:gap.fatLevel,
    calT:mT.cal,calR:mR.cal,pT:mT.p,pR:mR.p,cT:mT.c,cR:mR.c,fT:mT.f,fR:mR.f,
    strategy:stratName,strategyWhy:stratWhy,reasons:gap.reasons,warnings:warnings,
    deadline:dl,weeksTotal:weeksTotal,paceTarget:paceTarget,paceCut:paceCut,startWeight:profile.weight,
    basis:{pk:mT.pk,act:profile.activity},
    mealWeek:wkIdx,
    mealsT:genMeals(mT,ings),mealsR:genMeals(mR,ings),generatedAt:Date.now()};
  zsSet(KEYS.DIET,diet);
  if(!zsGet(KEYS.TRAIN,null))zsSet(KEYS.TRAIN,genTrainingPlan(profile));
}

/* ============ MACRO Q&A（营养素答疑 · 基于用户数据） ============ */
var qaHist=[];
function qaHistHtml(){
  if(!qaHist.length)return '<div class="qa-msg q">可直接问：三大营养素会不会偏高？蛋白质可以降低吗？碳水是不是太低？缺口合理吗？我会按你的身体数据与目标作答。</div>';
  return qaHist.map(function(m){return '<div class="qa-msg '+m.who+'">'+m.html+'</div>';}).join('');
}
function qaPush(who,html){qaHist.push({who:who,html:html});}
function qaApplyHtml(a){return '<br><button class="solid sm" style="margin-top:8px" data-at="'+a.apply.type+'" data-av="'+a.apply.val+'">'+esc(a.label)+'</button>';}
function bindQAApply(scope){
  var root=scope||document;
  root.querySelectorAll('[data-at]').forEach(function(btn){
    btn.onclick=function(){
      confirmApply({type:btn.getAttribute('data-at'),val:parseFloat(btn.getAttribute('data-av'))},btn.textContent);
    };
  });
}
/* 先确认、后执行：任何方案调整必须经用户明确同意 */
function confirmApply(a,label,desc,custom){
  var old=document.getElementById('cf-ov');if(old&&old.parentNode)old.parentNode.removeChild(old);
  var ov=document.createElement('div');ov.className='modal-ov';ov.id='cf-ov';
  var h='<div class="modal-box"><div class="mb-head"><b>确认调整方案</b><button class="mb-close" data-cl="1">关闭</button></div><div class="cf-box">即将执行：<b>'+esc(label||'方案调整')+'</b><br>'+(desc||'调整后将同步更新饮食计划、今日任务、数据趋势等全平台关联数据。')+'<div class="cf-row"><button class="solid sm" data-ok="1">确认调整</button><button class="ghost sm" data-cl="1">取消</button></div></div></div>';
  ov.innerHTML=h;document.body.appendChild(ov);
  function cl(){if(ov.parentNode)ov.parentNode.removeChild(ov);}
  ov.querySelectorAll('[data-cl]').forEach(function(b){b.onclick=cl;});
  ov.onclick=function(e){if(e.target===ov)cl();};
  ov.querySelector('[data-ok]').onclick=function(){
    if(a&&a.type)applyMacroAdj(a);
    if(typeof custom==='function')custom();
    qaPush('a','✓ 已应用调整并同步全平台（饮食计划、今日任务、数据趋势等已更新）。');
    cl();refreshAll();
  };
}
function bindQA(){
  var send=$('qa-send'),inp=$('qa-input');if(!send)return;
  function ask(){
    var q=(inp.value||'').trim();if(!q)return;
    inp.value='';
    qaPush('q',esc(q));
    var a=macroAnswer(q);
    qaPush('a',a.t+(a.act?qaApplyHtml(a.act):''));
    var h=$('qa-hist');
    if(h){h.innerHTML=qaHistHtml();h.scrollTop=h.scrollHeight;bindQAApply(h);}
  }
  send.onclick=ask;

  document.querySelectorAll('.qa-chips button').forEach(function(b){b.onclick=function(){inp.value=b.getAttribute('data-q');ask();};});
  bindQAApply();
}
function macroAnswer(q){
  var diet=zsGet(KEYS.DIET,null);
  if(!diet)return{t:'请先在上方保存身体数据并生成方案，我才有依据作答。'};
  var profile=zsGet(KEYS.PROFILE,DEF_PROFILE),w=parseFloat(profile.weight)||70;
  var goal=zsGet(KEYS.GOAL,DEF_GOAL);
  var b=diet.basis||{},pkNow=b.pk||1.8;
  var freq=parseInt(profile.weeklyDays)||0;
  var has=function(){for(var i=0;i<arguments.length;i++)if(q.indexOf(arguments[i])>=0)return true;return false;};
  /* ---- 全局通用答疑：身体数据 / 目标 / 周期 / 训练设计 ---- */
  if(has('身体数据','数据怎么','数据怎么样','BMI','体脂')){
    var bmi2=profile.weight/((profile.height/100)*(profile.height/100));
    var bfTxt=diet.bfKnown?('体脂率 '+diet.bfRaw+'%（'+(diet.fatLevel==='high'?'偏高':diet.fatLevel==='mid'?'中等':'偏低')+'）'):'未填写体脂率（按 BMI 评估）';
    return{t:'你的身体数据：'+(profile.sex==='m'?'男':'女')+' · '+profile.age+' 岁 · '+profile.height+'cm · '+profile.weight+'kg。BMI <b>'+bmi2.toFixed(1)+'</b>（'+(bmi2>=28?'肥胖区间':bmi2>=24?'超重区间':'正常区间')+'），'+bfTxt+'。基础代谢 BMR <b>'+diet.bmr+'</b> kcal（Mifflin-St Jeor 公式），日常活动系数 '+profile.activity+'。这些数据是全平台计算的源头：改体重/体脂/活动量后，热量与营养素目标都会重算。'};
  }
  if(has('周期','周数','截止','倒推','多长时间','时长','节奏')){
    var cyc='未设置截止日期，当前按 '+goal.duration+' 周规划。';
    if(diet.deadline)cyc='截止日期 <b>'+esc(diet.deadline)+'</b>，总周期 <b>'+diet.weeksTotal+' 周</b>：目标要求平均每周减 <b>'+diet.paceTarget+'kg</b>，当前缺口对应约 <b>'+diet.paceCut+'kg/周</b>（7700kcal≈1kg 脂肪）。';
    return{t:'周期安排逻辑：'+cyc+' 趋势统计周期、周期倒计时、周度复盘循环均按此时长自动倒推——修改截止日期后全平台联动，无需手动调整。安全速度为每周 1~1.5kg，超过会给出警告。'};
  }
  if(has('训练计划','设计思路','怎么安排训练','分化','练什么','训练怎么')){
    var train=zsGet(KEYS.TRAIN,[]);
    var tN=train.filter(function(d){return d.isTraining;}).length;
    var parts=train.filter(function(d){return d.isTraining;}).map(function(d){return d.bodyPart;}).join('、');
    return{t:'训练计划设计思路：按你档案「每周 '+profile.weeklyDays+' 练」生成分化，当前为 '+tN+' 个训练日（'+(parts||'无')+'）。原则：①大肌群优先（胸/背/腿热量效率最高）；②考虑伤病约束——'+esc((profile.injuries||'无')+'')+'，全部使用固定器械与安全替代动作；③7 天为一个循环、不绑定自然周，可自定义起始日与每日标题；④每次修改后自动做部位均衡/容量/恢复/目标匹配 4 维评估。'};
  }
  if(has('目标','体重降','减到','减重目标')){
    return{t:'目标设定：从 '+profile.weight+'kg 到 <b>'+goal.targetWeight+'kg</b>'+(diet.deadline?('，截止 '+esc(diet.deadline)+'（'+diet.weeksTotal+' 周）'):'（按 '+goal.duration+' 周规划）')+'。终极目标是体重降至 85kg 左右、体脂 20% 以下、肌肉量 65kg 以上，分 3~4 个周期渐进完成，本周期目标可在上方「目标详情」里自由编辑。'};
  }
  if(has('蛋白')){
    if(has('降低','低点','减','太多','偏高','高')){
      var pkMin=1.6;
      if(pkNow<=pkMin)return{t:'当前蛋白质 '+diet.pT+'g/日（'+pkNow+'g/kg），已处于减脂期下限。蛋白在热量缺口里承担"保肌肉"的安全锚作用——你体脂 30%+ 且每周 '+freq+' 练，再降会明显增加掉肌肉风险。不建议继续降。'};
      var np=Math.max(pkNow-0.2,pkMin),npG=Math.min(Math.round(np*w),230);
      return{t:'当前蛋白质 '+diet.pT+'g/日（'+pkNow+'g/kg×'+w+'kg）。减脂+高频训练下 1.8~2.0g/kg 是循证区间，并不算高——蛋白的饱腹感最强、产热效应最高（20~30%），是最"划算"的热量。若你仍想下调，下限为 '+pkMin+'g/kg ≈ '+npG+'g/日，保肌效果会打一定折扣。',act:{label:'调整为 '+npG+'g/日（'+np+'g/kg）',apply:{type:'pk',val:np}}};
    }
    return{t:'当前蛋白质 '+diet.pT+'g/日，系数 '+pkNow+'g/kg 体重。按你 '+freq+' 次/周的训练量与减脂目标，1.8~2.0g/kg 是主流循证区间：缺口状态下肌肉蛋白合成需要充足原料，且蛋白质饱腹感最强（实际吸收消耗其热量的 20~30%），帮你坚持计划。'};
  }
  if(has('碳水')){
    if(has('高','太多','降低','减','砍')){
      return{t:'训练日碳水 '+diet.cT+'g（约 '+(diet.cT/w).toFixed(1)+'g/kg）、休息日 '+diet.cR+'g。你的碳水不是热量的"大头"，而是围绕训练精确投放的燃料：训练日要支撑每周 '+freq+' 练的糖原消耗。若确实吃不下，可下调 30g/日（总热量相应 −120kcal），训练表现可能略降。',act:{label:'下调 30g/日（总热量 −120kcal）',apply:{type:'c',val:-30}}};
    }
    if(has('低','不够','加','提高')){
      return{t:'训练日碳水 '+diet.cT+'g、约 '+(diet.cT/w).toFixed(1)+'g/kg。对每周 '+freq+' 次力量训练，训练日 2~3g/kg 已是合理下限——再低会影响训练质量与恢复。可上调 30g/日（总热量 +120kcal），优先加在训练前后。',act:{label:'上调 30g/日（总热量 +120kcal）',apply:{type:'c',val:30}}};
    }
    return{t:'训练日碳水 '+diet.cT+'g / 休息日 '+diet.cR+'g。碳水是"训练燃料"变量：训练日摄入匹配每周 '+freq+' 次训练的糖原消耗，休息日压低以扩大脂肪供能窗口——这正是「'+diet.strategy+'」的调度逻辑。'};
  }
  if(has('脂肪')){
    return{t:'脂肪 '+diet.fT+'g/日（0.55g/kg，不低于 40g）。脂肪不是可随意压缩的热量余量——它维持睾酮等基础激素分泌、脂溶性维生素吸收与细胞膜结构。成年男性长期低于 0.5g/kg 会明显影响激素与体感。当前取值已在精简端，不建议再降。'};
  }
  if(has('缺口','热量','总摄入','怎么算')){
    var spd=diet.deadline?('按 7700kcal≈1kg 脂肪折算，当前缺口对应约 <b>'+diet.paceCut+'kg/周</b>；截止日期 '+esc(diet.deadline)+' 要求平均 <b>'+diet.paceTarget+'kg/周</b>。'):'';
    var chain='计算链：<b>Mifflin-St Jeor 公式</b> × 你的身体数据 → BMR <b>'+diet.bmr+'</b> kcal → 乘活动系数得双档 TDEE（训练日 <b>'+diet.tdeeT+'</b> / 休息日 <b>'+diet.tdeeR+'</b>，训练日 +10%、休息日 −5%）→ 扣掉热量缺口得每日摄入。';
    return{t:'热量是这样算出来的：'+chain+'当前日缺口 '+diet.cut+'kcal，占 TDEE 的 '+Math.round(diet.pct*100)+'%（安全区间 13%~25%，按体脂水平定基准、平台期/长期减脂微调）。训练日摄入 '+diet.calT+'kcal、休息日 '+diet.calR+'kcal，均高于安全下限。'+spd};
  }
  if(has('高','偏多','过量')){
    return{t:'先看总量：训练日 '+diet.calT+'kcal 是"TDEE '+diet.tdeeT+' 减缺口"倒推出来的，并非偏高摄入。三项里：蛋白 '+diet.pT+'g 是保肌的循证区间值；碳水 '+diet.cT+'g 用来供每周 '+freq+' 次训练；脂肪 '+diet.fT+'g 已是健康下限附近。整体不高，其中最值得保留的恰是蛋白质。可分别点上方快捷问题查看单项。'};

}
function applyMacroAdj(a){
  var diet=zsGet(KEYS.DIET,null);if(!diet)return;
  var profile=zsGet(KEYS.PROFILE,DEF_PROFILE),w=parseFloat(profile.weight)||70;
  var ings=zsGet(KEYS.ING,DEF_ING);
  if(a.type==='pk'){
    var np=Math.max(1.2,Math.min(2.4,a.val));
    var p=Math.min(Math.round(np*w),230),f=diet.fT;
    diet.pT=p;diet.pR=p;
    diet.cT=Math.max(60,Math.round((diet.calT-4*p-9*f)/4));
    diet.cR=Math.max(50,Math.round((diet.calR-4*p-9*f)/4));
    diet.basis=diet.basis||{};diet.basis.pk=np;
    diet.adjNote='蛋白质调整为 '+np+'g/kg（'+p+'g/日）';
  }else if(a.type==='c'){
    var d=a.val;
    diet.cT=Math.max(50,diet.cT+d);diet.cR=Math.max(40,diet.cR+d);
    diet.calT+=4*d;diet.calR+=4*d;
    diet.adjNote='碳水调整 '+(d>0?'+':'')+d+'g/日（总热量 '+(d>0?'+':'')+(4*d)+'kcal）';
  }else{return;}
  diet.adjustedAt=Date.now();
  diet.mealsT=genMeals({p:diet.pT,c:diet.cT,f:diet.fT},ings);
  diet.mealsR=genMeals({p:diet.pR,c:diet.cR,f:diet.fR},ings);
  zsSet(KEYS.DIET,diet);
}

function mpDay(diet,dk){return dk==='T'?diet.mealsT:diet.mealsR;}
function mpTargets(diet,dk){return dk==='T'?{p:diet.pT,c:diet.cT,f:diet.fT,cal:diet.calT}:{p:diet.pR,c:diet.cR,f:diet.fR,cal:diet.calR};}
function mpSearch(q){
  q=String(q||'').toLowerCase();var res=[];
  var ings=zsGet(KEYS.ING,DEF_ING);
  ings.forEach(function(x){if(x.name.toLowerCase().indexOf(q)>=0&&res.length<8)res.push({name:x.name,cat:x.cat,p:x.p,c:x.c,f:x.f,kcal:x.kcal});});
  if(res.length<8)searchFood(q).forEach(function(f){

}

function mpRecalc(dk){
  var diet=zsGet(KEYS.DIET,null);if(!diet)return;
  var m=mpDay(diet,dk);if(!m||!m.plan)return;
  var tg=mpTargets(diet,dk);
  recalcPlan(m.plan,tg);
  /* 补剂（高蛋白类）按剩余蛋白自动补足 */
  m.plan.forEach(function(meal){
    if(meal.key!=='supplement')return;
    meal.items=meal.items.filter(function(it){return (it.p||0)>=8;});
    if(!meal.items.length)return;
    var tot=planTotals(m.plan),rem=tg.p-tot.p;
    if(rem>3)meal.items.forEach(function(it){it.gram=Math.max(5,r5(rem/((it.p||80)/100)/meal.items.length));});
  });
  var t=planToText(m.plan);
  m.breakfast=t.breakfast;m.lunch=t.lunch;m.dinner=t.dinner;m.supplement=t.supplement;m.totals=t.totals;
  zsSet(KEYS.DIET,diet);
}

function cyclePos(){
  var cyc=zsGet(KEYS.CYCLE,null)||{start:todayStr()};

}

function showEval(auto){
  var plan=zsGet(KEYS.TRAIN,[]);
  var profile=zsGet(KEYS.PROFILE,DEF_PROFILE);
  var dims=evaluatePlan(plan,profile);

  var ov=document.createElement('div');ov.className='modal-ov';ov.id='eval-ov';

  if(auto)h+='<div style="padding:10px 20px 0;font-size:12px;color:#8f8f8f">检测到计划变更，已自动触发评估</div>';
  dims.forEach(function(d){
    h+='<div class="ev-dim"><div class="ed-head"><b>'+esc(d.name)+'</b><span class="ev-score '+d.level+'">'+(d.level==='good'?'合理':d.level==='warn'?'注意':'需调整')+'</span></div><div class="ed-txt">'+d.text+'</div>'+(d.advice?'<div class="ed-adv"><b>建议：</b>'+esc(d.advice)+'</div>':'')+'</div>';
  });

function evaluatePlan(plan,profile){
  var dims=[],goal=zsGet(KEYS.GOAL,DEF_GOAL);
  var days=plan.filter(function(d){return d.isTraining;});
  var n=days.length;
  /* 维度1：部位分配均衡性 */
  function grp(p){
    p=p||'';
    if(p.indexOf('胸')>=0)return '胸';if(p.indexOf('背')>=0)return '背';
    if(p.indexOf('肩')>=0)return '肩';if(p.indexOf('腿')>=0||p.indexOf('臀')>=0)return '腿';
    if(p.indexOf('三头')>=0||p.indexOf('二头')>=0||p.indexOf('臂')>=0)return '臂';
    if(p.indexOf('核心')>=0)return '核心';if(p.indexOf('有氧')>=0)return '有氧';
    return '其他';
  }
  var counts={};
  days.forEach(function(d){d.exercises.forEach(function(ex){var g=grp(ex.part);counts[g]=(counts[g]||0)+1;});});
  var covered=Object.keys(counts).filter(function(g){return counts[g]>0;});
  var missing=[];['胸','背','腿','肩'].forEach(function(g){if(!counts[g])missing.push(g);});
  var d1={name:'部位分配均衡性',level:'good',text:'每周直接覆盖 '+covered.length+' 个部位群：'+(covered.length?covered.map(function(g){return g+'×'+counts[g];}).join(' · '):'无')+'。',advice:''};
  if(missing.length&&n>=3&&goal.type==='fat_loss'){d1.level=missing.length>=3?'bad':'warn';d1.advice='缺少 '+missing.join('/')+' 的直接训练。减脂期大肌群训练的热量效率最高，建议至少保证胸/背/腿每周各 1 次。';}
  else if((counts['臂']||0)>((counts['胸']||0)+(counts['背']||0))){d1.level='warn';d1.advice='小臂肌群训练量超过大肌群，建议把容量优先给胸/背/腿。';}
  else d1.advice=n>=4?'部位覆盖完整，大肌群均有直接训练。':'低频训练下优先保证胸/背/腿三大肌群。';
  dims.push(d1);
  /* 维度2：训练容量合理性 */
  var totalSets=0,perDay=[];
  days.forEach(function(d){var s=0;d.exercises.forEach(function(ex){s+=parseInt(ex.sets)||0;});perDay.push(DAY_LABELS[d.day-1]+s+'组');totalSets+=s;});
  var avg=n?Math.round(totalSets/n):0;
  var d2={name:'训练容量合理性',level:'good',text:n?('每周总容量 '+totalSets+' 组 · '+n+' 个训练日 · 日均 '+avg+' 组（'+perDay.join('/')+'）。'):'当前没有训练日。',advice:''};
  if(n===0){d2.level='bad';d2.advice='全周无训练日，减脂期的消耗与保肌都依赖训练，建议至少安排 3 天。';}
  else if(avg>25){d2.level='warn';d2.advice='日均组数超过 25 组，单次时长过长会推升皮质醇、影响恢复，建议每个训练日 12~22 组。';}
  else if(avg<8){d2.level='warn';d2.advice='日均组数不足 8 组，刺激量偏小，建议每个动作 3 组、每日 3~5 个动作。';}
  else d2.advice='日均容量处于 12~22 组的高效区间，匹配减脂目标。';
  dims.push(d2);
  /* 维度3：恢复节奏科学性 */
  var d3={name:'恢复节奏科学性',level:'good',text:'',advice:''};
  var streak=0,maxStreak=0,sameAdj=[];
  var ordered=plan.slice().sort(function(a,b){return a.day-b.day;});
  for(var i=0;i<ordered.length;i++){
    if(ordered[i].isTraining){
      streak++;if(streak>maxStreak)maxStreak=streak;
      if(i>0&&ordered[i-1].isTraining){
        var pp=ordered[i-1].bodyPart||'',cp=ordered[i].bodyPart||'';
        if(pp&&cp&&pp!=='自定义'&&cp!=='自定义'&&pp===cp)sameAdj.push(DAY_LABELS[ordered[i].day-1]+'与'+DAY_LABELS[ordered[i-1].day-1]+'连续练同一部位（'+cp+'）');
      }
    }else streak=0;
  }
  d3.text='每周 '+n+' 练 '+(7-n)+' 休 · 最长连续训练 '+maxStreak+' 天'+(sameAdj.length?' · '+sameAdj.join('；'):'')+'。';
  if(n>=7){d3.level='bad';d3.advice='全周无完全休息日，建议至少保留 1 天完全休息。';}
  else if(maxStreak>3){d3.level='warn';d3.advice='连续训练超过 3 天，睡眠与蛋白质必须跟上；如恢复不足，在中间插入休息日。';}
  else if(sameAdj.length){d3.level='warn';d3.advice='同一部位连续两天训练，恢复窗口叠加不足，建议间隔至少 48 小时。';}
  else d3.advice='练休交替合理，恢复窗口充足。';
  dims.push(d3);
  /* 维度4：目标匹配度 */
  var d4={name:'目标匹配度',level:'good',text:'',advice:''};
  var hasCardio=(counts['有氧']||0)>0;
  d4.text='目标：'+(goal.type==='fat_loss'?'减脂':goal.type==='muscle'?'增肌':'塑形')+' · 计划 '+n+' 个训练日（档案设置 '+profile.weeklyDays+'）· 有氧'+(hasCardio?'已安排':'未安排')+'。';
  if(goal.type==='fat_loss'){
    if(n<3){d4.level='warn';d4.advice='减脂期建议每周 ≥3 个训练日维持肌肉量与热量消耗。';}
    else if(!hasCardio){d4.level='warn';d4.advice='计划中没有直接有氧动作。你的主要做功形式是日常步数——建议保持每日 8000 步以上，或训练后加 20~30 分钟快走。';}
    else d4.advice='力量+有氧组合匹配减脂目标，容量与节奏合理。';
  }else if(goal.type==='muscle'){
    if(n<3){d4.level='warn';d4.advice='增肌需要每周 ≥3 次力量训练积累刺激。';}
    else d4.advice='频率支持增肌积累，保持渐进超负荷。';
  }else d4.advice='塑形需要力量训练+可控有氧，当前结构可行。';
  if(n!==parseInt(profile.weeklyDays)){
    if(d4.level==='good')d4.level='warn';
    d4.advice+=' 计划训练日（'+n+'天）与档案设置（'+profile.weeklyDays+'天）不一致，建议对齐，或在「制定计划」页更新每周训练次数。';
  }
  dims.push(d4);
  return dims;
}

function cell2(k,v){return '<div class="cell"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>';}
function renderWtChart(wt){
  var box=$('wt-chart');if(!box)return;
  if(wt.length<2){box.innerHTML='<div class="empty-tip">记录2次以上体重后，这里会出现趋势曲线。</div>';return;}
  var W=640,H=220,P=34;
  var kgs=wt.map(function(x){return x.kg;}),mn=Math.min.apply(null,kgs),mx=Math.max.apply(null,kgs);
  if(mx-mn<1){mn-=0.5;mx+=0.5;}
  function X(i){return P+(W-2*P)*i/(wt.length-1);}
  function Y(k){return H-P-(H-2*P)*(k-mn)/(mx-mn);}
  var pts=wt.map(function(x,i){return X(i).toFixed(1)+','+Y(x.kg).toFixed(1);}).join(' ');
  var dots=wt.map(function(x,i){return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(x.kg).toFixed(1)+'" r="3.4" fill="#111"><title>'+x.date+' · '+x.kg+'kg</title></circle>';}).join('');
  /* V3: 每周平均体重点位（橙色标记 + 数值标注） */
  var wkMarks='';
  for(var wi=0;wi*7<wt.length;wi++){
    var seg=wt.slice(wi*7,wi*7+7);
    if(seg.length<3)continue;
    var avg=seg.reduce(function(s,x){return s+x.kg;},0)/seg.length;
    var mid=wi*7+Math.floor((seg.length-1)/2);
    var ax=X(mid).toFixed(1),ay=Y(avg).toFixed(1);
    wkMarks+='<line x1="'+ax+'" y1="'+ay+'" x2="'+ax+'" y2="'+(H-P)+'" stroke="#d97a00" stroke-width="1" stroke-dasharray="3,3" opacity=".5"/>';
    wkMarks+='<circle cx="'+ax+'" cy="'+ay+'" r="4.5" fill="#d97a00" stroke="#fff" stroke-width="1.5"><title>第 '+(wi+1)+' 周平均 '+avg.toFixed(1)+'kg</title></circle>';
    wkMarks+='<text x="'+ax+'" y="'+(ay-9)+'" font-size="9.5" fill="#d97a00" text-anchor="middle" font-family="monospace">W'+(wi+1)+' '+avg.toFixed(1)+'</text>';
  }
  var grid='';
  for(var gi=0;gi<=3;gi++){var gy=P+(H-2*P)*gi/3;var gk=(mx-(mx-mn)*gi/3).toFixed(1);grid+='<line x1="'+P+'" y1="'+gy+'" x2="'+(W-P)+'" y2="'+gy+'" stroke="#eee" stroke-width="1"/><text x="'+(P-6)+'" y="'+(gy+4)+'" font-size="10" fill="#8f8f8f" text-anchor="end" font-family="monospace">'+gk+'</text>';}
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;min-width:480px;height:auto">'+grid+'<polyline points="'+pts+'" fill="none" stroke="#111" stroke-width="2"/>'+dots+wkMarks+'<text x="'+P+'" y="'+(H-8)+'" font-size="10" fill="#8f8f8f" font-family="monospace">'+wt[0].date+'</text><text x="'+(W-P)+'" y="'+(H-8)+'" font-size="10" fill="#8f8f8f" text-anchor="end" font-family="monospace">'+wt[wt.length-1].date+'</text><text x="'+(W-P)+'" y="'+(P-14)+'" font-size="10" fill="#8f8f8f" text-anchor="end" font-family="monospace">● 每日体重　● Wn=周平均</text></svg>';
}
/* V3: 本周平均体重 vs 上周（下降/上升/持平 + 公斤数） */
function renderWeeklyDiff(wt){
  var el=$('wk-diff');if(!el)return;
  if(wt.length<7){el.innerHTML='';return;}
  function avg(arr){return arr.reduce(function(s,x){return s+x.kg;},0)/arr.length;}
  var last7=wt.slice(-7),prev7=wt.slice(-14,-7);
  var a=Math.round(avg(last7)*10)/10;
  if(!prev7.length){el.innerHTML='本周（近 7 天）平均体重 <b>'+a+' kg</b>。再积累一周数据后，将自动对比上周平均体重。';return;}
  var b=Math.round(avg(prev7)*10)/10;
  var d=Math.round((a-b)*10)/10;
  var st,cls;

function addChat(type,text){var cb=$('chat-box');var d=document.createElement('div');d.className='chat-msg '+type;d.textContent=text;cb.appendChild(d);cb.scrollTop=cb.scrollHeight;}
function genReview(){
  var d=rvState.data,train=zsGet(KEYS.TRAIN,[]);
  var day=train[d.dayIdx-1];var planned=day?day.exercises.length:0;var done=d.exercises?d.exercises.length:0;
  var completion=planned?Math.round(done/planned*100):0;
  var verdict,nextAction;
  if(completion>=100&&parseInt(d.rpe)<=7){verdict='完成度优秀，强度适中，可按计划继续';nextAction='下次可尝试加重 5~10% 或加 1 次';}
  else if(completion>=100&&parseInt(d.rpe)===8){verdict='完成度优秀，强度到位，注意恢复';nextAction='保证休息与蛋白质摄入，下次保持当前强度';}
  else if(completion<100){verdict='未完成全部动作，下次优先补完';nextAction='下次优先完成遗漏的动作';}
  else{verdict='训练完成，继续按计划执行';nextAction='按计划执行下次训练';}
  if(d.feeling&&(d.feeling.indexOf('疼')>=0||d.feeling.indexOf('不适')>=0)){verdict+='；注意关注不适信号';nextAction='下次训练前确认无痛，必要时调整动作';}
  var summary='['+d.day+'] 完成度 '+completion+'%('+done+'/'+planned+') · RPE '+(d.rpe||'-');
  if(d.exercises&&d.exercises.length)summary+=' · 动作：'+d.exercises.map(function(e){return e.name+':'+(e.weight||'?')+'kg';}).join('、');
  if(d.feeling)summary+=' · 感受：'+d.feeling;
  var finish=function(urls){
    var review={date:d.date,day:d.day,exercises:d.exercises,completion:completion,rpe:d.rpe,feeling:d.feeling,summary:summary,verdict:verdict,nextAction:nextAction,images:urls,createdAt:Date.now()};
    var reviews=zsGet(KEYS.REVIEWS,[]);reviews.push(review);zsSet(KEYS.REVIEWS,reviews);
    var cb2=zsGet(KEYS.CHECK,{});cb2[d.date]=cb2[d.date]||{};if(d.exercises)d.exercises.forEach(function(e){cb2[d.date][e.name]=true;});zsSet(KEYS.CHECK,cb2);
    addChat('sys','复盘已生成：'+verdict+'；下次：'+nextAction);
    $('chat-input').innerHTML='<button class="solid sm" id="rv-start">再复盘一次</button>';
    $('rv-start').onclick=startReviewChat;
    setTimeout(function(){renderReview();checkWeekly();},100);
  };
  if(!rvFiles.length){finish([]);return;}
  Promise.all(rvFiles.map(uploadImage)).then(finish).catch(function(){finish([]);});
}
function checkWeekly(){
  var wt=zsGet(KEYS.WEIGHT,[]);if(wt.length<7)return;
  var weekly=zsGet(KEYS.WEEKLY,[]);
  var lastEnd=weekly.length?weekly[weekly.length-1].endDate:null;
  var after=lastEnd?wt.filter(function(x){return x.date>lastEnd;}):wt.slice();
  if(after.length<7)return;
  genWeekly(after);
}
function genWeekly(wtData){
  var train=zsGet(KEYS.TRAIN,[]);
  var tDays=train.filter(function(d){return d.isTraining;}).length;
  var checkin=zsGet(KEYS.CHECK,{});
  var diet=zsGet(KEYS.DIET,null);
  var sd=wtData[0].date,ed=wtData[wtData.length-1].date;
  var cDays=0;Object.keys(checkin).forEach(function(date){if(date>=sd&&date<=ed)cDays++;});
  var fw=wtData[0].kg,lw=wtData[wtData.length-1].kg;
  var wc=Math.round((lw-fw)*10)/10;
  var aw=Math.round(wtData.reduce(function(s,x){return s+x.kg;},0)/wtData.length*10)/10;
  var comp=tDays?Math.round(cDays/tDays*100):0;
  var title,sug=[],sum='';
  if(comp<70){title='完成率偏低';sug.push('训练完成率 '+comp+'%，建议适当降低训练量或调整安排');}
  else{title='完成率良好';}
  sum+='本周训练 '+cDays+'/'+tDays+' 天，完成率 '+comp+'%。体重 '+fw+'->'+lw+'kg('+(wc>0?'+'+wc:wc)+'kg)，周均 '+aw+'kg。';
  /* 饮食执行评估：按体重变化 vs 计划节奏判断 */
  var pace=diet?(diet.paceCut||0):0;
  var dietEval='体重变化与计划节奏基本一致，饮食执行良好。';
  if(wc<-1.5){sug.push('体重下降偏快('+wc+'kg/周)，注意热量不要低于安全下限');sum+='减重速度偏快。';dietEval='减重快于计划节奏（计划约 '+pace+'kg/周），饮食执行可能偏严。';}
  else if(wc>-0.3&&wc<=0){sug.push('体重变化小('+wc+'kg)，可适度收紧饮食或增加步数');sum+='减重速度偏慢。';dietEval='体重近乎持平，建议检查饮食记录与称重条件（同时间、同着装）。';}
  else if(wc>0){sug.push('体重上升 '+wc+'kg，建议检查饮食依从性');sum+='体重上升。';dietEval='体重上升，饮食依从性可能不足，回看当日实际摄入。';}
  else{sum+='减重速度正常。';}
  /* 优化方向建议 */
  sug.push('优化方向：保持蛋白质吃满目标、每日 8000 步以上；连续两周完成率 ≥90% 可考虑小幅加重');
  var report={startDate:sd,endDate:ed,title:title,summary:sum,completion:comp,weightChange:wc,avgWeight:aw,checkinDays:cDays,trainingDays:tDays,dietEval:dietEval,suggestions:sug.join('；'),createdAt:Date.now()};
  /* V3：调整建议先确认后执行，不再自动修改方案 */
  if(wc<-1.5){report.pendingAdj={calT:100,calR:100,reason:'体重下降偏快（'+wc+'kg/周），建议训练/休息日各 +100kcal'};}
  else if(wc>-0.3&&wc<=0){report.pendingAdj={calT:-100,calR:-100,reason:'体重变化偏小（'+wc+'kg/周），建议训练/休息日各 −100kcal（或增加步数代替）'};}
  var w=zsGet(KEYS.WEEKLY,[]);w.push(report);zsSet(KEYS.WEEKLY,w);
}
/* 应用周复盘建议的方案调整（用户确认后执行，全平台同步） */
function applyWeeklyAdj(idx){
  var weekly=zsGet(KEYS.WEEKLY,[]);
  var w=weekly[idx];
  if(!w||!w.pendingAdj)return;
  confirmApply(null,'周复盘方案调整：'+w.pendingAdj.reason,'调整将同步更新饮食计划、今日任务与数据趋势等全平台关联数据。',function(){
    var diet=zsGet(KEYS.DIET,null);
    var val=w.pendingAdj.calT;
    if(diet){
      diet.calT+=val;diet.calR+=(w.pendingAdj.calR||val);
      diet.cT=Math.max(50,Math.round((diet.calT-4*diet.pT-9*diet.fT)/4));
      diet.cR=Math.max(40,Math.round((diet.calR-4*diet.pR-9*diet.fR)/4));
      var ings=zsGet(KEYS.ING,DEF_ING);
      diet.mealsT=genMeals({p:diet.pT,c:diet.cT,f:diet.fT},ings);
      diet.mealsR=genMeals({p:diet.pR,c:diet.cR,f:diet.fR},ings);
      diet.adjustedAt=Date.now();diet.adjNote=w.pendingAdj.reason;
      zsSet(KEYS.DIET,diet);
    }
    w.adjApplied=true;weekly[idx]=w;zsSet(KEYS.WEEKLY,weekly);
  });
}

function copyText(t,ok){var fb=function(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');syncStat(ok);}catch(e){syncStat('复制失败。',true);}document.body.removeChild(ta);};try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){syncStat(ok);},fb);}else fb();}catch(e){fb();}}
function syncStat(msg,isErr){var el=$('sync-status');if(!el)return;el.className='sync-status '+(isErr?'err':'ok');el.textContent=msg;}
function syncStats(){var p=zsGet(KEYS.PROFILE,null);var wt=zsGet(KEYS.WEIGHT,[]);var rv=zsGet(KEYS.REVIEWS,[]);var st=CLOUD.online?'云端已连接':'离线（本地缓存）';syncStat('数据状态：'+(p?'已建档':'未建档')+' · 体重 '+wt.length+' 条 · 复盘 '+rv.length+' 条 · '+st);}
/* 生成一个全新的、独立的空白工作台链接（不含当前用户任何数据） */
function createShareLink(){
  if(!CLOUD.online){syncStat('当前离线，无法生成分享链接。',true);return;}
  fetch('/api/workspace/new').then(function(r){return r.json();}).then(function(res){
    var t=res&&res.token; if(!t){syncStat('生成失败，请稍后重试。',true);return;}
    var url=location.origin+'/?ws='+t;
    copyText(url,'已复制空白分享链接（独立、不含你的数据）');
  }).catch(function(){syncStat('生成失败，请检查网络后重试。',true);});
}
/* 跳回当前用户自己的工作台（用本地保存的主令牌） */
function backToMine(){
  var t=_localGet('zs5_ws');
  if(!t){syncStat('未找到你的工作台，将为你新建一个。');location.href=location.origin+'/';return;}
  location.href=location.origin+'/?ws='+encodeURIComponent(t);
}
/* 迁移本机旧数据（升级前浏览器残留的 zs5_* / zaoshen_*）到云端 */
function migrateLocalToCloud(){
  if(!CLOUD.token){syncStat('尚未连接云端。',true);return;}
  var data={},mt2={},n=0;
  SYNC_KEYS.concat([KEYS.MIGRATED,KEYS.SYNCLAST]).forEach(function(k){var v=_localGet(k);if(v==null)return;data[k]=v;mt2[k]=Date.now();n++;});
  ['zaoshen_weight_v1','zaoshen_diet_v1','zaoshen_goals_v1','zaoshen_check_v1'].forEach(function(k){var v=_localGet(k);if(v==null)return;data[k]=v;mt2[k]=Date.now();n++;});
  if(!n){syncStat('本机未检测到旧数据，无需迁移。');return;}
  fetch('/api/migrate/'+encodeURIComponent(CLOUD.token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:data,mt:mt2})})
    .then(function(r){return r.json();}).then(function(res){syncStat('已迁移 '+n+' 项旧数据到云端，即将刷新…');setTimeout(function(){location.reload();},1200);})
    .catch(function(){syncStat('迁移失败，请检查网络后重试。',true);});
}
/* 下载云端完整备份（导出为可再导入的 ZS5 文本） */
function downloadCloudBackup(){
  if(!CLOUD.token){syncStat('尚未连接云端。',true);return;}
  fetch('/api/workspace/'+encodeURIComponent(CLOUD.token)).then(function(r){return r.json();}).then(function(res){
    var payload={a:'zs5',v:2,t:Date.now(),d:(/Mobile|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)?'手机':'电脑'),mt:res.mt||{},data:res.data||{}};
    var code='ZS5.'+b64e(JSON.stringify(payload));
    try{var blob=new Blob([code],{type:'text/plain'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zs5-backup-'+todayStr()+'.txt';document.body.appendChild(a);a.click();document.body.removeChild(a);syncStat('云端备份已下载。');}catch(e){syncStat('下载失败。',true);}
  }).catch(function(){syncStat('读取云端失败。',true);});
}
/* 从备份文本 / 旧版 ZS5 同步码导入到当前工作台 */
function doImport(mode){
  var txt=($('sync-import').value||'').replace(/^\uFEFF/,'').trim();if(!txt){syncStat('请先粘贴备份内容或选择文件。',true);return;}
  var obj=null;
  if(txt.indexOf('ZS5.')===0){try{obj=JSON.parse(b64d(txt.slice(4)));}catch(e){obj=null;}}
  if(!obj){try{obj=JSON.parse(txt);}catch(e){obj=null;}}
  if(!obj||(!obj.data&&!obj.a)){syncStat('内容无法识别。',true);return;}
  var inc=obj.data||{},incMt=obj.mt||{};
  var data={},mt2={};
  Object.keys(inc).forEach(function(k){data[k]=inc[k];mt2[k]=(mode==='replace')?Date.now():(incMt[k]||Date.now());});
  if(!CLOUD.token){syncStat('尚未连接云端。',true);return;}
  fetch('/api/workspace/'+encodeURIComponent(CLOUD.token),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:data,mt:mt2})})
    .then(function(r){return r.json();}).then(function(res){
      Object.keys(res.data||{}).forEach(function(k){DB[k]=res.data[k];});Object.keys(res.mt||{}).forEach(function(k){mt[k]=res.mt[k]||0;});_saveMirror();
      syncStat('导入成功（'+(mode==='merge'?'合并':'覆盖')+'），页面即将刷新…');setTimeout(function(){location.reload();},1200);
    }).catch(function(){syncStat('导入失败，请检查网络后重试。',true);});
}

/* ============ REFRESH + MIGRATION + INIT ============ */
function refreshAll(){renderToday();renderPlan();renderDiet();renderTraining();renderTrend();renderGuide();}
function migrateOld(){
  if(zsGet(KEYS.MIGRATED,false))return;
  try{
    var oldWt=JSON.parse(localStorage.getItem('zaoshen_weight_v1')||'null');
    if(oldWt&&Array.isArray(oldWt)&&oldWt.length){zsSet(KEYS.WEIGHT,oldWt);}
    var oldDiet=JSON.parse(localStorage.getItem('zaoshen_diet_v1')||'null');
    if(oldDiet){var p={sex:oldDiet.sex||'m',age:parseInt(oldDiet.age)||25,height:parseFloat(oldDiet.h)||170,weight:parseFloat(oldDiet.w)||70,bf:parseFloat(oldDiet.bf)||0,activity:oldDiet.act||'1.375',weeklyDays:parseInt(oldDiet.freq)||3,progress:oldDiet.prog||'new',injuries:''};zsSet(KEYS.PROFILE,p);}
    var oldGoal=JSON.parse(localStorage.getItem('zaoshen_goals_v1')||'null');
    if(oldGoal&&oldGoal.items){var g=DEF_GOAL;g.items=oldGoal.items;zsSet(KEYS.GOAL,g);}
    var oldChk=JSON.parse(localStorage.getItem('zaoshen_check_v1')||'null');
    if(oldChk&&typeof oldChk==='object'){zsSet(KEYS.CHECK,oldChk);}
  }catch(e){}
  zsSet(KEYS.MIGRATED,true);
}

/* 云端启动：先拉取云端数据（失败回退本地镜像），再执行原有迁移与渲染 */
cloudInit(function(){
migrateOld();
initNav();
var _p=zsGet(KEYS.PROFILE,null);
if(_p&&!zsGet(KEYS.DIET,null)){generatePlans();}
/* V3 迁移：训练日补 title 字段；初始化循环起始日期 */
(function(){
  var tr=zsGet(KEYS.TRAIN,null);
  if(tr){var ch=false;tr.forEach(function(d){if(!d.title){d.title=d.bodyPart||'自定义';ch=true;}});if(ch)zsSet(KEYS.TRAIN,tr);}
  if(!zsGet(KEYS.CYCLE,null))zsSet(KEYS.CYCLE,{start:todayStr()});
})();
/* 每周自动轮换三餐食谱（仅从用户食材库匹配）；旧版文本食谱自动升级为结构化可编辑食谱（保留已调整的营养素目标） */
(function(){
  var d0=zsGet(KEYS.DIET,null);
  if(d0){
    var wk0=Math.floor(Date.now()/604800000);
    var needMeal=!d0.mealsT||!d0.mealsT.plan||!d0.mealsR||!d0.mealsR.plan;
    if(d0.mealWeek!==wk0||needMeal){
      var ings0=zsGet(KEYS.ING,DEF_ING);
      d0.mealWeek=wk0;
      d0.mealsT=genMeals({p:d0.pT,c:d0.cT,f:d0.fT},ings0);
      d0.mealsR=genMeals({p:d0.pR,c:d0.cR,f:d0.fR},ings0);
      zsSet(KEYS.DIET,d0);
    }
  }
})();
if(!zsGet(KEYS.ING,null)){zsSet(KEYS.ING,DEF_ING);}
if(!zsGet(KEYS.TRAIN,null)&&_p){zsSet(KEYS.TRAIN,genTrainingPlan(_p));}
renderToday();renderPlan();renderDiet();renderTraining();renderTrend();renderGuide();
go('today');
});
})();
